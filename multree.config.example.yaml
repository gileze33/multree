# multree example manifest.
#
# Copy this file to ~/.multree/default.yaml (or any other profile name).
# Edit it to describe your own repos.
#
# multree reads the manifest from:
#   <$MULTREE_HOME or ~/.multree>/<profile>.yaml
#
# Profile resolution, in order:
#   1. --profile <name> CLI flag
#   2. $MULTREE_PROFILE env var
#   3. "default"
# Then aliases.json (one hop) gives the resolved profile name. Manage with
# `multree profile list|path|alias|unalias`.
#
# Once your manifest is in place: `multree create <group> [--include <repo,...>]`.

version: 1

# Parent directory for every group. Each group becomes
# <worktree_root>/<group-name>/<repo-basename>/.
worktree_root: ~/dev/worktree

# Default strategy used by `multree update` when no per-repo override and no
# --strategy flag is given. Either "rebase" (default) or "merge".
# update_strategy: merge

# What to do when a target branch is already checked out in a repo's main
# source: "switch" (default) moves the main checkout onto its branch_base
# (with leading "origin/" stripped), "detach" leaves it on a detached HEAD,
# "error" refuses to act. Per-repo overrides allowed.
# main_checkout_action: detach

# Concurrency cap for the prime / install phases of `multree create` (and
# the setup phase when parallel_setup is true). CLI `--jobs N` overrides
# this; default is the host's CPU count.
# jobs: 4

# Run the setup phase in parallel up to `jobs`, respecting depends_on.
# Default false: setup runs serially because it often touches shared
# resources (ports, databases). Flip on if your setup hooks are isolated.
# parallel_setup: true

# Manifest-level default hook timeout. Overridden by `repos.<name>.hooks.timeout`
# and individual hook objects' `timeout`. Accepts "5m", "30s", "500ms", or a
# bare number (seconds). No timeout if unset.
# hook_timeout: 10m

# Repos `create` uses when you don't pass `--include`, for the common case where
# most groups span the same set. An explicit `--include` always wins. Unknown
# keys (and empty or duplicated lists) fail at config load.
# default_include: [api, frontend]

tools:
    # `multree <tool> <group>` runs the configured command inside the chosen
    # worktree. `open_in` is a preference chain -- `$root` is the group folder,
    # anything else is a repo key; first non-null wins.
    code:
        command: ["code", "{cwd}"]
        open_in: $root
    # Example: open Claude Code in the api worktree, falling back to the root.
    # claude:
    #     command: claude
    #     open_in: [api, $root]

# Optional cmux integration (https://cmux.com). When this block is present AND
# multree is running inside cmux, `multree create` opens a cmux workspace laid
# out as Claude on the left and, on the right, one pane per included repo: a
# "service" pane for each repo that declares a `run` command target, or a plain
# shell in the repo's worktree otherwise. On-demand equivalents:
# `multree cmux up|down|status <group>` (and `--cmux` / `--no-cmux` on create).
# Remove this block entirely to make multree never touch cmux.
# cmux:
#     # When create opens a workspace. Unset (default): on when this block is
#     # present and we're inside cmux. true/false force it on/off regardless;
#     # --cmux / --no-cmux on create override per invocation.
#     auto: true
#     # Width fraction (0..1) of the left Claude pane; the stack takes the rest.
#     split: 0.5
#     # Left-pane command. Defaults to the `claude` tool's command, else "claude".
#     claude: claude
#     # Which cmux sidebar group to open into. Unset or "current": the group the
#     # multree command was run from (ungrouped if the caller isn't in one).
#     # "none": always ungrouped. Any other value: upsert a group of that name.
#     # Override per run with --group <name|current> / --no-group.
#     group: current
#     # Per-repo pane override. Default: "service" if the repo has `run` targets,
#     # else "shell". Use a list for both, or "skip" to omit the repo.
#     panes:
#         api: [service, shell]   # run the dev server AND open a worktree shell
#         frontend: shell         # just a shell, even though it has a run target

# Optional conveniences for a `multree claude <group>` session opened at the
# group root. Both default off. They write only inside the group dir (and the
# group-root .mcp.json) -- never ~/.claude.json, workspace trust, or MCP
# approvals -- so, like any project settings, they take effect only once the
# group root is trusted (trust the worktree_root once: `cd <worktree_root> && claude`).
# claude_workspace:
#     # Fold each repo member's own checked-in .mcp.json servers into the merged
#     # group-root .mcp.json. Claude discovers .mcp.json only at the launch dir
#     # (plus user/managed scopes), never in subdirectories, so a sub-repo's
#     # servers are otherwise invisible from the group root. A hoisted stdio
#     # server's relative command is absolutized against its worktree.
#     hoist_member_mcps: true
#     # Write a group-root .claude/settings.json whose
#     # permissions.additionalDirectories lists each repo member's worktree.
#     # Inherited folder-trust excludes nested git repos, so this grants the
#     # session file access to the sibling worktrees. (It grants file access
#     # only; it does NOT load their .mcp.json -- that is hoist_member_mcps.)
#     additional_directories: true

repos:
    # Pick any short, stable key. Used on the CLI: `--include api,frontend`.
    api:
        # Absolute path (with ~/ expansion) to the main checkout.
        path: ~/dev/repo-a
        # Ref to fork new worktrees from. Defaults to origin/main.
        # branch_base: origin/develop
        hooks:
            # Runs in the new worktree after `prime_artifacts`. Optional.
            install: "pnpm install"
            # Runs after install. Optional. Use this to set up DB / pick ports / etc.
            setup: "pnpm run setup"
            # Runs on remove/destroy. Optional.
            teardown: "pnpm run teardown"
        # Read values from this worktree's env file after setup; other repos
        # reference them as {<repo>.<key>} in their consumes block.
        exposes:
            port:
                type: env_file
                file: .env.local
                key: API_PORT
        # Variables multree generates and allocates for this repo when it joins
        # a group. Exposed automatically as {<repo>.<name>} -- no `exposes`
        # entry needed -- so any repo (including this one, via its own
        # `consumes`) can reference {api.metrics_port}. The only pattern today
        # is an integer drawn from an inclusive [min, max] range; the chosen
        # value is guaranteed unique across every group in every profile (the
        # ledger lives in <$MULTREE_HOME>/variables.json) and is freed on
        # remove/destroy.
        # variables:
        #     metrics_port:
        #         type: number
        #         min: 9000
        #         max: 9099
        #         # Fallback for consumers when this repo isn't in the group;
        #         # the allocated value wins (and rewires them) when it is. A
        #         # `defaults.metrics_port` entry below would override this.
        #         default: 9000
        # Fallback values used when this repo is NOT included in the group --
        # e.g. point frontends at the default dev port.
        defaults:
            port: 5000
        # Override the manifest-level update_strategy for this repo. Optional.
        # update_strategy: rebase
        # Set to false to skip this repo in `multree push` (e.g. read-only
        # mirror). Defaults to true.
        # push: false
        # APFS reflink large trees (node_modules etc.) from the main checkout
        # into the worktree so install reconciles instead of cold-installing.
        prime_artifacts:
            - find: node_modules
              strategy: reflink

    frontend:
        path: ~/dev/repo-b
        hooks:
            install: "pnpm install"
            # Per-hook timeout overrides repo-level / manifest-level defaults.
            # setup:
            #     command: "pnpm run setup"
            #     timeout: 90s
        # frontend's setup waits for api's setup to finish (so api.port is
        # resolved before the templated value below is written).
        # depends_on: [api]
        # Write templated env vars into the worktree's env file, inside a block
        # bracketed by `# >>> multree-managed: <group> >>>` / `# <<< ... <<<`
        # so `rewire` is idempotent.
        consumes:
            file: .env.local
            upsert:
                API_URL: "http://localhost:{api.port}"
        prime_artifacts:
            - find: node_modules
              strategy: reflink

    # `consumes` can also be an array, for a monorepo with several env files:
    # web:
    #     path: ~/dev/repo-c
    #     hooks:
    #         install: "yarn install"
    #     # Repo-scoped runnable commands. Each key under `commands` is a TARGET
    #     # (e.g. a package in a monorepo); each key under a target is an ACTION
    #     # verb, dispatched as `multree <action> <group> <target>`. Verbs are
    #     # implicit -- whatever you name them -- so adding `build`/`test`/etc.
    #     # costs only a manifest key, never code. A target name must be unique
    #     # across all repos in a group (it's addressed flat). An action's value
    #     # is a shell string, an argv array, or { command, cwd } to override the
    #     # target's cwd. `{cwd}` is substituted, as for tools.
    #     commands:
    #         app-one:
    #             cwd: packages/app-one    # subdir relative to the worktree; omit to run at the repo root
    #             run: yarn dev            # multree run <group> app-one
    #             build: yarn build        # multree build <group> app-one
    #         app-two:
    #             cwd: packages/app-two
    #             run: yarn dev
    #     consumes:
    #         - file: packages/app-one/.env
    #           upsert:
    #               REACT_APP_API_URL: "http://localhost:{api.port}"
    #         - file: packages/app-two/.env
    #           upsert:
    #               REACT_APP_API_URL: "http://localhost:{api.port}"

# Non-repo process members: sidecars you run from a published binary (a mail
# sink, a mock service, a tunnel), not checked out and developed. An app has no
# git worktree; multree gives it a per-group scratchpad dir
# (<worktree_root>/<group>/<app>/) as its cwd and launches it from `run`. It
# joins the same variables / exposes / consumes / mcps wiring as a repo, and is
# selected the same way -- `--include api,mailcatcher`, or via default_include.
# Two app-only conveniences: because multree launches the process itself, `env`
# is injected directly (no dotfile to write and source), and every member gets a
# built-in `{<member>.included}` token ("true" when in the group, "" otherwise)
# so a repo can auto-wire to a sidecar only when it's present -- e.g. a repo's
# consumes could set `SMTP_ENABLED: "{mailcatcher.included}"`.
# apps:
#     mailcatcher:
#         # depends_on a repo so its exposes (e.g. {api.port}) are resolved first.
#         depends_on: [api]
#         variables:
#             http_port: { type: number, min: 8200, max: 8249, default: 8025 }
#             smtp_port: { type: number, min: 1100, max: 1149, default: 1025 }
#         # Templated env injected straight into the process (same {member.key}
#         # tokens as consumes) -- no file is written.
#         env:
#             PORT: "{mailcatcher.http_port}"
#             SMTP_PORT: "{mailcatcher.smtp_port}"
#             RELAY_URL: "http://localhost:{api.port}/inbound"
#             DATA_DIR: "./data"          # relative to the scratchpad cwd
#         run: some-mailcatcher-cli        # multree run <group> mailcatcher
#         # Contribute an MCP server to the merged group-root .mcp.json (all
#         # members' `mcps` are deep-merged under `mcpServers`, keyed by name).
#         mcps:
#             mailcatcher:
#                 type: http
#                 url: "http://localhost:{mailcatcher.http_port}/mcp"
